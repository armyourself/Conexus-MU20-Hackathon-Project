<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Hospital Inventory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f1419;
            color: #e4e6eb;
            min-height: 100vh;
        }

        /* Navbar Styles */
        .navbar {
            background: #1a1f26;
            padding: 1rem 2rem;
            border-bottom: 1px solid #2d3748;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar-brand span {
            font-size: 1.8rem;
        }

        .navbar-menu {
            display: flex;
            gap: 1rem;
            list-style: none;
        }

        .navbar-menu a {
            color: #9ca3af;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .navbar-menu a:hover {
            background: #2d3748;
            color: #10b981;
        }

        .navbar-menu a.active {
            background: #10b981;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2rem;
            color: #10b981;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #9ca3af;
        }

        .alerts-grid {
            display: grid;
            gap: 1.5rem;
        }

        .alert-card {
            background: #1a1f26;
            border-radius: 12px;
            border: 1px solid #2d3748;
            padding: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            transition: all 0.3s ease;
        }

        .alert-card:hover {
            border-color: #10b981;
            transform: translateY(-2px);
        }

        .alert-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .alert-icon.critical {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .alert-icon.warning {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .alert-icon.info {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .alert-content {
            flex: 1;
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .alert-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #fff;
        }

        .alert-time {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .alert-description {
            color: #9ca3af;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .alert-details {
            display: flex;
            gap: 2rem;
            font-size: 0.875rem;
        }

        .alert-detail {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .alert-detail-label {
            color: #9ca3af;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .alert-detail-value {
            color: #fff;
            font-weight: 600;
        }

        .alert-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.875rem;
        }

        .btn-primary {
            background: #10b981;
            color: #fff;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .btn-secondary {
            background: #2d3748;
            color: #9ca3af;
        }

        .btn-secondary:hover {
            background: #374151;
            color: #fff;
        }

        .filter-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: #1a1f26;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid #2d3748;
        }

        .filter-tab {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            color: #9ca3af;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .filter-tab:hover {
            background: #2d3748;
            color: #10b981;
        }

        .filter-tab.active {
            background: #10b981;
            color: #fff;
        }

        .empty-state {
            background: #1a1f26;
            border-radius: 12px;
            border: 1px solid #2d3748;
            padding: 3rem;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: #9ca3af;
        }

        @media (max-width: 768px) {
            .navbar-menu {
                flex-direction: column;
                gap: 0.5rem;
            }

            .alert-details {
                flex-direction: column;
                gap: 0.75rem;
            }

            .filter-tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <span>🏥</span>
                Hospital Inventory
            </div>
            <ul class="navbar-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="alerts.html" class="active">Alerts</a></li>
                <li><a href="reports.html">Reports</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1>Alerts & Notifications</h1>
            <p>Monitor critical inventory issues and take action</p>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <div class="filter-tab active" onclick="filterAlerts('all')">All Alerts</div>
            <div class="filter-tab" onclick="filterAlerts('critical')">Critical</div>
            <div class="filter-tab" onclick="filterAlerts('warning')">Warnings</div>
            <div class="filter-tab" onclick="filterAlerts('info')">Info</div>
        </div>

        <!-- Alerts List -->
        <div class="alerts-grid" id="alertsContainer">
            <!-- Alerts will be loaded here -->
        </div>
    </div>

    <script>
        let alerts = [];
        let currentFilter = 'all';

        async function fetchAlerts() {
            try {
                const response = await fetch('http://localhost:3000/api/medicines');
                const medicines = await response.json();
                generateAlerts(medicines);
            } catch (error) {
                console.error('Error fetching data:', error);
                // Sample data
                const sampleMedicines = [
                    { id: 1, name: 'Paracetamol 500mg', quantity: 150, expiry_date: '2025-12-31', supplier: 'PharmaCorp Ltd', category: 'Painkiller' },
                    { id: 2, name: 'Amoxicillin 250mg', quantity: 8, expiry_date: '2025-08-15', supplier: 'MediSupply Inc', category: 'Antibiotic' },
                    { id: 3, name: 'Ibuprofen 400mg', quantity: 75, expiry_date: '2026-03-20', supplier: 'HealthPharma', category: 'Painkiller' },
                    { id: 4, name: 'Vitamin C 1000mg', quantity: 5, expiry_date: '2025-11-10', supplier: 'VitaHealth', category: 'Vitamin' },
                ];
                generateAlerts(sampleMedicines);
            }
        }

        function generateAlerts(medicines) {
            alerts = [];

            medicines.forEach(medicine => {
                // Low stock alert
                if (medicine.quantity < 10) {
                    alerts.push({
                        type: 'critical',
                        icon: '⚠️',
                        title: 'Critical Low Stock Alert',
                        description: `${medicine.name} is running critically low. Immediate reorder required.`,
                        medicine: medicine.name,
                        quantity: medicine.quantity,
                        supplier: medicine.supplier,
                        time: 'Just now'
                    });
                }

                // Expiring soon alert
                const daysUntilExpiry = Math.floor((new Date(medicine.expiry_date) - new Date()) / (1000 * 60 * 60 * 24));
                if (daysUntilExpiry < 30 && daysUntilExpiry > 0) {
                    alerts.push({
                        type: 'warning',
                        icon: '📅',
                        title: 'Medicine Expiring Soon',
                        description: `${medicine.name} will expire in ${daysUntilExpiry} days. Plan usage or removal.`,
                        medicine: medicine.name,
                        quantity: medicine.quantity,
                        expiryDate: new Date(medicine.expiry_date).toLocaleDateString(),
                        time: '2 hours ago'
                    });
                }

                // Very low quantity alert
                if (medicine.quantity === 0) {
                    alerts.push({
                        type: 'critical',
                        icon: '🚨',
                        title: 'Out of Stock',
                        description: `${medicine.name} is completely out of stock. Order immediately.`,
                        medicine: medicine.name,
                        quantity: 0,
                        supplier: medicine.supplier,
                        time: '30 minutes ago'
                    });
                }
            });

            // Add some info alerts
            alerts.push({
                type: 'info',
                icon: 'ℹ️',
                title: 'Inventory Sync Complete',
                description: 'Database synchronization completed successfully. All records are up to date.',
                time: '1 day ago'
            });

            renderAlerts();
        }

        function renderAlerts() {
            const container = document.getElementById('alertsContainer');
            
            let filteredAlerts = alerts;
            if (currentFilter !== 'all') {
                filteredAlerts = alerts.filter(alert => alert.type === currentFilter);
            }

            if (filteredAlerts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <h3>No ${currentFilter === 'all' ? '' : currentFilter} alerts</h3>
                        <p>Everything is running smoothly!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredAlerts.map(alert => `
                <div class="alert-card">
                    <div class="alert-icon ${alert.type}">
                        ${alert.icon}
                    </div>
                    <div class="alert-content">
                        <div class="alert-header">
                            <div class="alert-title">${alert.title}</div>
                            <div class="alert-time">${alert.time}</div>
                        </div>
                        <div class="alert-description">${alert.description}</div>
                        ${alert.medicine ? `
                            <div class="alert-details">
                                <div class="alert-detail">
                                    <span class="alert-detail-label">Medicine</span>
                                    <span class="alert-detail-value">${alert.medicine}</span>
                                </div>
                                ${alert.quantity !== undefined ? `
                                    <div class="alert-detail">
                                        <span class="alert-detail-label">Quantity</span>
                                        <span class="alert-detail-value">${alert.quantity} units</span>
                                    </div>
                                ` : ''}
                                ${alert.supplier ? `
                                    <div class="alert-detail">
                                        <span class="alert-detail-label">Supplier</span>
                                        <span class="alert-detail-value">${alert.supplier}</span>
                                    </div>
                                ` : ''}
                                ${alert.expiryDate ? `
                                    <div class="alert-detail">
                                        <span class="alert-detail-label">Expiry Date</span>
                                        <span class="alert-detail-value">${alert.expiryDate}</span>
                                    </div>
                                ` : ''}
                            </div>
                            <div class="alert-actions">
                                <button class="btn btn-primary" onclick="alert('Order initiated for ${alert.medicine}')">Order Now</button>
                                <button class="btn btn-secondary" onclick="alert('Alert dismissed')">Dismiss</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function filterAlerts(type) {
            currentFilter = type;
            
            // Update active tab
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderAlerts();
        }

        // Initialize
        fetchAlerts();
    </script>
</body>
</html>
