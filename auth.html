<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auth | Conexus</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="page-auth">

      <div class="dock-right">
        <button id="themeToggle" class="icon-btn" title="Toggle theme">🌓</button>
      </div>
    </nav>
  </header>

 <main class="auth-container card">
  <h1>Welcome to Conexus 👋</h1>

  <div class="tabs">
    <button id="loginTab" class="tab active">Sign In</button>
    <button id="signupTab" class="tab">Sign Up</button>
  </div>

  <!-- Login -->
  <form id="loginForm" class="form-stack active" autocomplete="on">
    <input id="loginUsername" type="text" placeholder="Username" required />
    <input id="loginPassword" type="password" placeholder="Password" required />
    <button type="submit" class="primary-btn">Sign In</button>
    <p id="loginMsg" class="msg"></p>
  </form>

  <!-- Signup -->
  <form id="signupForm" class="form-stack" autocomplete="on" style="display:none;">
    <input id="signupUsername" type="text" placeholder="Username" required />
    <input id="signupEmail" type="email" placeholder="Email" required />
    <input id="signupPassword" type="password" placeholder="Password" required />
    <button type="submit" class="primary-btn">Create Account</button>
    <p id="signupMsg" class="msg"></p>
  </form>

  <footer class="auth-footer">
    <p>🔒 Your account is secure with us</p>
  </footer>
</main>

<script>
  // Switch tabs
  const loginTab = document.getElementById("loginTab");
  const signupTab = document.getElementById("signupTab");
  const loginForm = document.getElementById("loginForm");
  const signupForm = document.getElementById("signupForm");

  loginTab.onclick = () => {
    loginForm.style.display = "block";
    signupForm.style.display = "none";
    loginTab.classList.add("active");
    signupTab.classList.remove("active");
  };

  signupTab.onclick = () => {
    signupForm.style.display = "block";
    loginForm.style.display = "none";
    signupTab.classList.add("active");
    loginTab.classList.remove("active");
  };

  // Store users locally (demo only)
  const users = JSON.parse(localStorage.getItem("users")) || [];

  signupForm.onsubmit = (e) => {
    e.preventDefault();
    const username = signupUsername.value.trim();
    const email = signupEmail.value.trim();
    const password = signupPassword.value.trim();

    if (users.some((u) => u.username === username)) {
      signupMsg.textContent = "⚠️ Username already exists!";
      return;
    }

    users.push({ username, email, password });
    localStorage.setItem("users", JSON.stringify(users));
    signupMsg.textContent = "✅ Account created! You can sign in now.";
    signupForm.reset();
  };

  loginForm.onsubmit = (e) => {
    e.preventDefault();
    const username = loginUsername.value.trim();
    const password = loginPassword.value.trim();
    const user = users.find((u) => u.username === username && u.password === password);

    if (user) {
      localStorage.setItem("loggedInUser", JSON.stringify(user));
      window.location.href = "dashboard.html"; // redirect after login
    } else {
      loginMsg.textContent = "❌ Invalid username or password.";
    }
  };
</script>

</body>
</html>
