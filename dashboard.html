<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav>
    <h2>Conexus</h2>
    <ul>
      <li><a href="dashboard.html" class="active">Dashboard</a></li>
      <li><a href="inventory.html">Inventory</a></li>
      <li><a href="alerts.html">Alerts</a></li>
    </ul>
    <button id="themeToggle">🌓</button>
  </nav>

  <div class="container">
    <h1>Dashboard Overview</h1>
    <div class="grid-4">
      <div class="card">Total Medicines: <span id="totalMeds">0</span></div>
      <div class="card">Low Stock: <span id="lowStock">0</span></div>
      <div class="card">Expiring Soon: <span id="expiringSoon">0</span></div>
      <div class="card">Total Stock Value: ₹<span id="totalValue">0</span></div>
    </div>

    <div class="card full">
      <h2>Inventory Overview</h2>
      <canvas id="stockChart"></canvas>
    </div>

    <div class="card full">
      <h2>Recent Activity</h2>
      <ul id="recentActivity"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
