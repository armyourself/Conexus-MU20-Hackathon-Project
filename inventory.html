<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventory | Conexus</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="page-inventory">
  <!-- Dock-like navbar -->
  <header class="dock-wrap" id="topDock">
    <nav class="dock navbar">
      <div class="dock-left">
        <h2 class="brand">Conexus</h2>
      </div>

      <ul class="dock-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="inventory.html" class="active">Inventory</a></li>
        <li><a href="emergencies.html" class="active">Emergencies</a></li>
        <li><a href="alert.html">Alerts</a></li>
      </ul>

      <div class="dock-right">
        <button id="themeToggle" class="icon-btn" title="Toggle theme">🌓</button>
      </div>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">📦 Inventory Management</h1>

    <section class="card add-card">
      <h2>Add Medicine</h2>
      <div class="form-row">
        <input id="medName" type="text" placeholder="Medicine name">
        <input id="medQty" type="number" placeholder="Quantity">
        <input id="medExpiry" type="date" placeholder="Expiry date">
        <input id="medSupplier" type="text" placeholder="Supplier">
        <input id="medCategory" type="text" placeholder="Category">
        <button id="addMedicineBtn" class="primary-btn">Add</button>
      </div>
    </section>

    <section class="card search-card">
      <input id="search" type="search" placeholder="🔍 Search by name / supplier / category">
    </section>

    <section class="card table-card">
      <h2>All Medicines</h2>
      <table id="inventoryTable" class="styled-table">
        <thead>
          <tr>
            <th>#</th><th>Name</th><th>Qty</th><th>Expiry</th><th>Supplier</th><th>Category</th><th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
</body>
</html>
