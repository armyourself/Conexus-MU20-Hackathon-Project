<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <h2>🩺 Conexus</h2>
    </div>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="inventory.html" class="active">Inventory</a></li>
      <li><a href="alerts.html">Alerts</a></li>
    </ul>
    <div class="nav-right">
      <button id="themeToggle" title="Toggle Theme">🌓</button>
    </div>
  </nav>

  <main class="content">
    <section class="header-section">
      <div>
        <h1>Inventory Management</h1>
        <p>Monitor, manage, and update all medicines in real time 💊</p>
      </div>
      <button class="primary-btn" onclick="openAddModal()">+ Add Medicine</button>
    </section>

    <section class="search-section">
      <input type="text" id="search" placeholder="🔍 Search for medicines..." />
    </section>

    <section class="table-section">
      <table class="styled-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Medicine Name</th>
            <th>Quantity</th>
            <th>Expiry Date</th>
            <th>Supplier</th>
            <th>Category</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryTable">
          <!-- Data goes here dynamically -->
        </tbody>
      </table>
    </section>
  </main>

  <!-- Add Medicine Modal -->
  <div id="addModal" class="modal">
    <div class="modal-box">
      <h2>Add New Medicine</h2>
      <form id="addMedicineForm">
        <div class="form-group">
          <label>Medicine Name</label>
          <input type="text" id="medName" required />
        </div>
        <div class="form-group">
          <label>Quantity</label>
          <input type="number" id="medQty" required />
        </div>
        <div class="form-group">
          <label>Expiry Date</label>
          <input type="date" id="medExpiry" required />
        </div>
        <div class="form-group">
          <label>Supplier</label>
          <input type="text" id="medSupplier" required />
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="medCategory" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary-btn" onclick="closeAddModal()">Cancel</button>
          <button type="button" class="primary-btn" onclick="addMedicine()">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>



  <script src="script.js"></script>
</body>
</html>
