<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Hospital Inventory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f1419;
            color: #e4e6eb;
            min-height: 100vh;
        }

        /* Navbar Styles */
        .navbar {
            background: #1a1f26;
            padding: 1rem 2rem;
            border-bottom: 1px solid #2d3748;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar-brand span {
            font-size: 1.8rem;
        }

        .navbar-menu {
            display: flex;
            gap: 1rem;
            list-style: none;
        }

        .navbar-menu a {
            color: #9ca3af;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .navbar-menu a:hover {
            background: #2d3748;
            color: #10b981;
        }

        .navbar-menu a.active {
            background: #10b981;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            font-size: 2rem;
            color: #10b981;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #10b981;
            color: #fff;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .btn-secondary {
            background: #2d3748;
            color: #9ca3af;
        }

        .btn-secondary:hover {
            background: #374151;
            color: #fff;
        }

        .btn-danger {
            background: #ef4444;
            color: #fff;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .search-bar {
            background: #1a1f26;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #2d3748;
            margin-bottom: 2rem;
        }

        .search-bar input {
            width: 100%;
            padding: 0.75rem;
            background: #0f1419;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #e4e6eb;
            font-size: 1rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #10b981;
        }

        .table-container {
            background: #1a1f26;
            border-radius: 12px;
            border: 1px solid #2d3748;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #0f1419;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #9ca3af;
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        td {
            padding: 1rem;
            border-top: 1px solid #2d3748;
            color: #e4e6eb;
        }

        tbody tr:hover {
            background: #0f1419;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-badge.low { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .status-badge.expiring { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-badge.normal { background: rgba(16, 185, 129, 0.2); color: #10b981; }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1f26;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #2d3748;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            color: #10b981;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #9ca3af;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: #0f1419;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #e4e6eb;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #10b981;
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 768px) {
            .navbar-menu {
                flex-direction: column;
                gap: 0.5rem;
            }

            .page-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            table {
                font-size: 0.875rem;
            }

            th, td {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <span>🏥</span>
                Hospital Inventory
            </div>
            <ul class="navbar-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="inventory.html" class="active">Inventory</a></li>
                <li><a href="alerts.html">Alerts</a></li>
                <li><a href="reports.html">Reports</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1>Medicine Inventory</h1>
            <button class="btn btn-primary" onclick="openAddModal()">+ Add Medicine</button>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search medicines by name, supplier, or category..." onkeyup="filterMedicines()">
        </div>

        <!-- Inventory Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Medicine Name</th>
                        <th>Quantity</th>
                        <th>Expiry Date</th>
                        <th>Supplier</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Medicine Modal -->
    <div id="medicineModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Medicine</h2>
            </div>
            <form id="medicineForm">
                <input type="hidden" id="medicineId">
                <div class="form-group">
                    <label>Medicine Name</label>
                    <input type="text" id="medicineName" required>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="medicineQuantity" required min="0">
                </div>
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="date" id="medicineExpiry" required>
                </div>
                <div class="form-group">
                    <label>Supplier</label>
                    <input type="text" id="medicineSupplier" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="medicineCategory" required>
                        <option value="">Select Category</option>
                        <option value="Painkiller">Painkiller</option>
                        <option value="Antibiotic">Antibiotic</option>
                        <option value="Vitamin">Vitamin</option>
                        <option value="Diabetes">Diabetes</option>
                        <option value="Cardiac">Cardiac</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save Medicine</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let medicines = [];
        const API_URL = 'http://localhost:3000/api/medicines';

        async function fetchMedicines() {
            try {
                const response = await fetch(API_URL);
                medicines = await response.json();
                renderTable();
            } catch (error) {
                console.error('Error fetching medicines:', error);
                // Load sample data
                medicines = [
                    { id: 1, name: 'Paracetamol 500mg', quantity: 150, expiry_date: '2025-12-31', supplier: 'PharmaCorp Ltd', category: 'Painkiller' },
                    { id: 2, name: 'Amoxicillin 250mg', quantity: 8, expiry_date: '2025-08-15', supplier: 'MediSupply Inc', category: 'Antibiotic' },
                    { id: 3, name: 'Ibuprofen 400mg', quantity: 75, expiry_date: '2026-03-20', supplier: 'HealthPharma', category: 'Painkiller' },
                    { id: 4, name: 'Vitamin C 1000mg', quantity: 5, expiry_date: '2025-11-10', supplier: 'VitaHealth', category: 'Vitamin' },
                    { id: 5, name: 'Aspirin 100mg', quantity: 120, expiry_date: '2025-09-30', supplier: 'PharmaCorp Ltd', category: 'Painkiller' },
                ];
                renderTable();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = medicines.map(medicine => {
                const status = getStatus(medicine);
                return `
                    <tr>
                        <td>${medicine.id}</td>
                        <td>${medicine.name}</td>
                        <td>${medicine.quantity}</td>
                        <td>${new Date(medicine.expiry_date).toLocaleDateString()}</td>
                        <td>${medicine.supplier}</td>
                        <td>${medicine.category}</td>
                        <td><span class="status-badge ${status.class}">${status.text}</span></td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-secondary btn-sm" onclick="editMedicine(${medicine.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteMedicine(${medicine.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getStatus(medicine) {
            if (medicine.quantity < 10) {
                return { class: 'low', text: 'Low Stock' };
            }
            const daysUntilExpiry = Math.floor((new Date(medicine.expiry_date) - new Date()) / (1000 * 60 * 60 * 24));
            if (daysUntilExpiry < 30 && daysUntilExpiry > 0) {
                return { class: 'expiring', text: 'Expiring Soon' };
            }
            return { class: 'normal', text: 'Normal' };
        }

        function filterMedicines() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = medicines.filter(m => 
                m.name.toLowerCase().includes(searchTerm) ||
                m.supplier.toLowerCase().includes(searchTerm) ||
                m.category.toLowerCase().includes(searchTerm)
            );
            
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = filtered.map(medicine => {
                const status = getStatus(medicine);
                return `
                    <tr>
                        <td>${medicine.id}</td>
                        <td>${medicine.name}</td>
                        <td>${medicine.quantity}</td>
                        <td>${new Date(medicine.expiry_date).toLocaleDateString()}</td>
                        <td>${medicine.supplier}</td>
                        <td>${medicine.category}</td>
                        <td><span class="status-badge ${status.class}">${status.text}</span></td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-secondary btn-sm" onclick="editMedicine(${medicine.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteMedicine(${medicine.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Medicine';
            document.getElementById('medicineForm').reset();
            document.getElementById('medicineId').value = '';
            document.getElementById('medicineModal').classList.add('active');
        }

        function editMedicine(id) {
            const medicine = medicines.find(m => m.id === id);
            if (medicine) {
                document.getElementById('modalTitle').textContent = 'Edit Medicine';
                document.getElementById('medicineId').value = medicine.id;
                document.getElementById('medicineName').value = medicine.name;
                document.getElementById('medicineQuantity').value = medicine.quantity;
                document.getElementById('medicineExpiry').value = medicine.expiry_date;
                document.getElementById('medicineSupplier').value = medicine.supplier;
                document.getElementById('medicineCategory').value = medicine.category;
                document.getElementById('medicineModal').classList.add('active');
            }
        }

        function closeModal() {
            document.getElementById('medicineModal').classList.remove('active');
        }

        async function deleteMedicine(id) {
            if (!confirm('Are you sure you want to delete this medicine?')) return;

            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                alert('Medicine deleted successfully!');
                fetchMedicines();
            } catch (error) {
                console.error('Error deleting medicine:', error);
                medicines = medicines.filter(m => m.id !== id);
                renderTable();
            }
        }

        document.getElementById('medicineForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                name: document.getElementById('medicineName').value,
                quantity: parseInt(document.getElementById('medicineQuantity').value),
                expiry_date: document.getElementById('medicineExpiry').value,
                supplier: document.getElementById('medicineSupplier').value,
                category: document.getElementById('medicineCategory').value
            };

            const id = document.getElementById('medicineId').value;
            
            try {
                if (id) {
                    await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    alert('Medicine updated successfully!');
                } else {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    alert('Medicine added successfully!');
                }
                closeModal();
                fetchMedicines();
            } catch (error) {
                console.error('Error saving medicine:', error);
                alert('Operation completed (demo mode)');
                closeModal();
            }
        });

        // Initialize
        fetchMedicines();
    </script>
</body>
</html>
